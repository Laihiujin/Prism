# ============================================================
# Prism 桌面版发布流水线：打包 Windows / macOS 并发布到 GitHub Releases
#
# 更新通道：electron-updater github provider（见 desktop-electron/package.json build.publish）
#   - 主通道：GitHub Releases latest（latest.yml / latest-mac.yml + 安装包 + blockmap）
#   - 回滚/历史版本：GitHub API 拉 release 列表 + generic feed 指向
#     https://github.com/<owner>/<repo>/releases/download/<tag>/
#
# 版本一致性（自动处理）：
#   - push tag v<版本>：workflow 自动把 desktop-electron/package.json 的 version 同步为 <版本>
#   - 手动触发：填 version 输入则同步；留空则用 package.json 现有版本
#   - 资产名（Prism-<version>-setup.exe）与 tag 保持一致
#
# macOS 签名（默认 unsigned，Gatekeeper 会拦截，需右键打开）：
#   正式分发时配置 GitHub Secrets 后 electron-builder 自动签名/公证：
#     CSC_LINK（证书 .p12 的 base64）、CSC_KEY_PASSWORD
#     公证：APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID
# ============================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，如 1.2.0；留空则用 package.json version）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: prism-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NEXT_TELEMETRY_DISABLED: '1'
  # tag 触发: v1.2.0 → 1.2.0；手动触发: 用输入版本
  PRISM_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version }}

jobs:
  build-windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步版本号 (与 tag/输入一致)
        shell: bash
        run: |
          if [ -n "${PRISM_VERSION}" ]; then
            VERSION="${PRISM_VERSION#v}"
            node -e "const fs=require('fs');const p='desktop-electron/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n','utf8')"
            echo "✅ version 同步为 ${VERSION}"
          else
            echo "⚠️ 手动触发未填版本，使用 package.json 现有版本"
          fi
          node -p "require('./desktop-electron/package.json').version"

      - name: 构建前端 (Next.js standalone)
        working-directory: prism_frontend
        run: |
          npm ci
          npm run build

      - name: 构建 prismenv (Python 运行时)
        run: |
          python -m venv prismenv
          prismenv/Scripts/python.exe -m pip install --upgrade pip
          prismenv/Scripts/python.exe -m pip install -r requirements.txt

      - name: 构建 supervisor.exe (PyInstaller)
        run: |
          prismenv/Scripts/python.exe -m pip install pyinstaller
          prismenv/Scripts/python.exe -m PyInstaller build/supervisor.spec --clean --noconfirm
          if (Test-Path "dist/supervisor/supervisor.exe") {
            Copy-Item "dist/supervisor/supervisor.exe" "desktop-electron/resources/supervisor/supervisor.exe"
          } elseif (Test-Path "dist/supervisor.exe") {
            Copy-Item "dist/supervisor.exe" "desktop-electron/resources/supervisor/supervisor.exe"
          } else {
            throw "supervisor.exe 未生成"
          }

      - name: 安装打包依赖 (desktop-electron)
        working-directory: desktop-electron
        run: npm ci

      - name: 下载 Redis Windows 二进制 (tporadowski/redis)
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "Prism-build" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tporadowski/redis/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "Redis-x64-*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "redis release 无 Redis-x64 zip 资产" }
          $zip = Join-Path $env:RUNNER_TEMP "redis-win.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $dest = "desktop-electron/resources/redis"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Get-ChildItem $dest | Select-Object -ExpandProperty Name

      - name: 准备占位目录 (services)
        run: |
          New-Item -ItemType Directory -Force -Path "dist/services" | Out-Null

      - name: electron-builder 打包 (不发布)
        working-directory: desktop-electron
        run: npx electron-builder --win --x64 --publish never

      - name: 校验 Windows 产物
        working-directory: desktop-electron
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "验证版本: ${VERSION}"
          node scripts/verify-release-assets.mjs dist-build "${VERSION}"

      - name: 上传安装包校验摘要
        if: always()
        shell: pwsh
        run: |
          echo "### Windows 产物" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path .\desktop-electron\dist-build -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } |
            ForEach-Object { "  - $($_.Name)  ($([math]::Round($_.Length / 1MB, 2)) MB)" >> $env:GITHUB_STEP_SUMMARY }

      - name: 上传 Windows 发布资产
        uses: actions/upload-artifact@v4
        with:
          name: prism-win-assets
          path: |
            desktop-electron/dist-build/*.exe
            desktop-electron/dist-build/*.exe.blockmap
            desktop-electron/dist-build/latest.yml
          if-no-files-found: error

  build-macos:
    name: macOS (dmg + zip)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步版本号 (与 tag/输入一致)
        shell: bash
        run: |
          if [ -n "${PRISM_VERSION}" ]; then
            VERSION="${PRISM_VERSION#v}"
            node -e "const fs=require('fs');const p='desktop-electron/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n','utf8')"
            echo "✅ version 同步为 ${VERSION}"
          else
            echo "⚠️ 手动触发未填版本，使用 package.json 现有版本"
          fi
          node -p "require('./desktop-electron/package.json').version"

      - name: 构建前端 (Next.js standalone)
        working-directory: prism_frontend
        run: |
          npm ci
          npm run build

      - name: 构建 prismenv (Python 运行时)
        run: |
          python3 -m venv prismenv
          prismenv/bin/python -m pip install --upgrade pip
          prismenv/bin/python -m pip install -r requirements.txt

      - name: 安装打包依赖 (desktop-electron)
        working-directory: desktop-electron
        run: npm ci

      - name: electron-builder 打包 (不发布)
        working-directory: desktop-electron
        run: npx electron-builder --mac --publish never

      - name: 校验 macOS 产物
        working-directory: desktop-electron
        shell: bash
        run: |
          echo "### macOS 产物" >> "$GITHUB_STEP_SUMMARY"
          # macOS 目标: dmg(通用) / zip / latest-mac.yml (+ blockmap)
          for f in dist-build/*.dmg dist-build/*.zip dist-build/*.blockmap dist-build/latest-mac.yml; do
            if [ -f "$f" ]; then
              echo "  - $(basename "$f")  ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: 上传 macOS 发布资产
        uses: actions/upload-artifact@v4
        with:
          name: prism-mac-assets
          path: |
            desktop-electron/dist-build/*.dmg
            desktop-electron/dist-build/*.zip
            desktop-electron/dist-build/*.blockmap
            desktop-electron/dist-build/latest-mac.yml
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: prism-win-assets
          path: .release-assets/win

      - uses: actions/download-artifact@v4
        with:
          name: prism-mac-assets
          path: .release-assets/mac

      - name: 解析版本与 tag
        id: resolve
        shell: bash
        run: |
          VERSION="${PRISM_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./desktop-electron/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本 => $VERSION, tag => v$VERSION"

      - name: 发布版本 Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.resolve.outputs.tag }}
          name: Prism ${{ steps.resolve.outputs.version }}
          prerelease: false
          draft: false
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
          body: |
            # Prism ${{ steps.resolve.outputs.version }}

            **自动发布的桌面版构建。** 版本 `${{ steps.resolve.outputs.version }}` · 标签 `${{ steps.resolve.outputs.tag }}` · 提交 `${{ github.sha }}`

            ---

            ## 📦 这版是什么

            Prism 是一个**AI 驱动的多平台内容自动发布与矩阵分发系统**，面向短视频平台的多账号运营场景：

            - **账号身份隔离**：同一台机器上运行多个账号，彼此隔离、互不牵连，平台侧不会识别为同一个操作者。
            - **多平台统一分发**：一套系统集中管理多个平台、多个账号的内容发布与数据回收。

            支持平台：**抖音 / 小红书 / 快手 / 视频号 / B 站 / YouTube / TikTok**。

            ---

            ## 🧩 核心功能

            ### 1. 多账号管理
            - 抖音 / 快手 / 小红书 / 视频号 / B 站：扫码登录
            - TikTok / YouTube：本机浏览器登录
            - Chrome 已登录 Profile 导入（非无痕）
            - 掉线检测

            ### 2. 账号身份隔离
            - Persona Studio 生成相干指纹（OS / UA / GPU / 时区 / 语言一致）
            - 未安装 Persona 时自动回退到独立 Patchright Profile
            - 每账号独立持久化登录会话（Cookie / LocalStorage / IndexedDB）

            ### 3. 网络层（代理 / IP 隔离）
            - 自研 Proxy Manager：健康检测、sticky 固定绑定、空闲池自动分配
            - 可选 per-country mihomo 代理网关（新加坡 / 日本 / 美国 / 德国 / 台湾 / 香港）
            - 出口 IP / 泄漏检测

            ### 4. 调度与执行
            - N 账号 × M 平台 × K 素材的矩阵任务生成
            - Celery + Redis 异步高并发队列
            - 定时发布、失败重试
            - 每账号 Redis 分布式执行锁（账号级互斥，同账号任务不互相争抢）

            ### 5. 监控与可观测性
            - 任务队列看板、执行日志
            - 账号环境视图（浏览器 × 代理 × 运行时状态一次返回）
            - 异常提醒

            ### 6. 数据回收
            - 抖音 / B 站本地采集
            - TikTok / YouTube 通过 TikHub API 采集
            - 自动反查回填账号资料（头像 / 昵称）

            ### 7. AI 编排
            - 内置 Agent（HermesAgent）：自然语言发布指令、标题 / 标签生成
            - 一键安装的技能 / 工具市场（`/tools`）
            - 可集成开源组件库、插件库与 skill 库

            ### 8. 多种接入方式
            - Web 控制台（Next.js）
            - Electron 桌面客户端（本版）
            - `prism` 命令行
            - 面向外部 AI Agent 的 stdio MCP 服务

            ---

            ## 🛠 技术栈

            FastAPI · Next.js · Celery/Redis · Patchright · Persona Studio · Electron · mihomo（代理网关）

            ---

            ## ⚠️ 合规声明

            请仅在**授权 / 自有账号场景**下使用，并遵守各平台用户协议。请勿提交 cookie、登录态、浏览器 profile、设备指纹、代理凭证、API key 到仓库。本项目**仅限测试、学术研究与技术交流使用**，请勿用于任何违反法律法规、平台服务条款的恶意攻击用途，因违规使用产生的后果由使用者自行承担。

            ---

            > 📖 完整文档见 [README](https://github.com/Laihiujin/Prism/blob/main/README.md) · [English](https://github.com/Laihiujin/Prism/blob/main/README_EN.md)
          artifacts: .release-assets/win/*, .release-assets/mac/*
