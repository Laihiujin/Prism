[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-publisher"
version = "0.1.0"
description = "Prism multi-platform content orchestration and publishing"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "aiohttp>=3.10",
  "aiohttp-cors>=0.7",
  "celery>=5.4,<5.5",
  "fastapi>=0.115",
  "httpx>=0.28",
  "httpx-sse>=0.4",
  "loguru>=0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.59.1",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.18",
  "python-dotenv>=1.0.1",
  "pytz>=2024.2",
  "qrcode[pil]>=8.0",
  "redis>=5.0",
  "requests>=2.32.3",
  "segno>=1.6.6",
  "sqlalchemy==2.0.49",
  "sse-starlette>=2.2",
  "toml>=0.10.2",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
prism = "prism_cli:main"

[tool.setuptools]
py-modules = ["prism_cli"]

[tool.vercel]
entrypoint = "prism_backend.fastapi_app.main:app"
