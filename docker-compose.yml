services:
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./runtime-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PRISM_ENV: docker
      PRISM_APP_ROOT: /app
      PRISM_DATA_DIR: /app/runtime-data
      PRISM_SUPERVISOR_MANAGES_HERMES_UI: "0"
      PRISM_HERMES_BIND_HOST: 0.0.0.0
      PRISM_HERMES_PUBLIC_HOST: 127.0.0.1
      PRISM_HERMES_HOME: /app/runtime-data/hermes-home
      PRISM_HERMES_WEBUI_STATE_DIR: /app/runtime-data/hermes-home/webui
      PRISM_HERMES_PYTHON: /app/prismenv/bin/python
      HERMES_ENABLED: "true"
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "9131"
      HERMES_HOME: /app/runtime-data/hermes-home
      HERMES_WEBUI_STATE_DIR: /app/runtime-data/hermes-home/webui
      HOST: 0.0.0.0
      PORT: "7000"
      PERSONA_ENABLED: "true"
      PERSONA_API_URL: http://127.0.0.1:8787
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_AUTO_INSTALL: "0"
      PLAYWRIGHT_HEADLESS: "true"
      LOCAL_CHROME_PATH: ""
      LOCAL_CHROME_HEADLESS_SHELL_PATH: ""
      LOCAL_FIREFOX_PATH: ""
      CELERY_CONCURRENCY: "8"
    ports:
      - "7000:7000"
      - "8787:8787"
      - "9119:9119"
      - "9131:9131"
    volumes:
      - ./runtime-data/app:/app/runtime-data
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:7000/health\").getcode() == 200 else 1)"'
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:7000
        PRISM_INTERNAL_BACKEND_URL: http://app:7000
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_URL: http://localhost:7000
      PRISM_INTERNAL_BACKEND_URL: http://app:7000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(\"http://127.0.0.1:3000\").then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
