<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism CMS</title>
<style nonce="__NONCE__">*{box-sizing:border-box}body{margin:0;background:#08090b;color:#eee;font:14px system-ui,sans-serif}main{max-width:1000px;margin:0 auto;padding:40px 24px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:18px}header{margin-bottom:30px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:0 0 20px}.muted,small{color:#a0a2ad;line-height:1.7}.badge{border:1px solid #2b2b2b;padding:6px 10px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{padding:26px;background:#111216;border:1px solid #2b2b2b;border-radius:14px}.wide{grid-column:1/-1}.row{padding:12px 0;border-bottom:1px solid #2b2b2b}.row:last-child{border-bottom:0}input,select,button{font:inherit;border:1px solid #2b2b2b;border-radius:7px;padding:10px;background:#08090b;color:#eee}input[type=checkbox]{width:18px;height:18px;accent-color:#ddd}input[type=password]{width:100%;margin-bottom:12px}button{cursor:pointer;background:#202127}button:disabled{opacity:.5}#notice{padding:16px 20px;border:1px solid #6a5224;border-radius:10px;background:#241d10;color:#e8cc92;margin-bottom:22px}#message{min-height:24px;color:#94e2b1;white-space:pre-wrap}.link{display:block;word-break:break-all;padding:12px 0;color:#c3c9f7}#channels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}#channels label{display:flex;align-items:center;gap:9px}.password{max-width:500px}a{color:#c3c9f7}@media(max-width:650px){.grid{grid-template-columns:1fr}#channels{grid-template-columns:1fr 1fr}.row{align-items:flex-start}header{align-items:flex-start}}</style></head>
<body><main><header><div><h1>Prism CMS</h1><span class="muted">运行配置与访问安全</span></div><div><span id="mode" class="badge">正在读取模式</span> <button id="logout">退出登录</button></div></header><div id="notice" hidden>当前入口已连接公网。请妥善保管链接并使用独立长密码；开发模式下的配置修改会作用于当前开发实例。</div><p id="message" role="status"></p>
<div class="grid"><section class="wide"><h2>访问与安全</h2><label class="row"><span>公域网络连接<br><small>开启后生成 HTTPS 访问链接，仍须密码验证</small></span><input id="publicEnabled" type="checkbox"></label><span id="publicUrl" class="link"></span><label class="row"><span>安全提醒<br><small>显示公网访问与当前运行模式提醒</small></span><input id="securityReminder" type="checkbox"></label><small>密码不会出现在链接中。公网入口仅开放本 CMS，不转发账号、文件和其他后台接口。</small></section>
<section><h2>浏览器与登录</h2><label class="row"><span>抖音登录模式</span><select id="loginMode"><option value="browser">浏览器（正式）</option><option id="experimental" value="http">HTTP（仅开发测试）</option></select></label><label class="row"><span>后台无头浏览器</span><input id="headless" type="checkbox"></label><p class="muted">生产模式仅允许浏览器登录。无头设置在下次启动浏览器时生效。</p></section>
<section><h2>更改访问密码</h2><form id="passwordForm" class="password"><input id="currentPassword" type="password" autocomplete="current-password" placeholder="当前密码" aria-label="当前密码" required><input id="newPassword" type="password" autocomplete="new-password" placeholder="新密码（至少 6 位）" aria-label="新密码" minlength="6" maxlength="128" required><button>保存密码并重新登录</button></form></section>
<section class="wide"><h2>平台渠道</h2><p class="muted">勾选的平台在账号、发布和统计页面中隐藏，账号数据保留。</p><div id="channels"></div></section></div></main>
<script nonce="__NONCE__">
let statusData={};let channels=[];const $=id=>document.getElementById(id);const message=(text,error=false)=>{$('message').textContent=text;$('message').style.color=error?'#fca5a5':'#94e2b1'};
async function api(url,method='GET',body){const response=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CMS-CSRF':statusData.csrf||''},...(body?{body:JSON.stringify(body)}:{})});if(response.status===401){location.replace('/login');throw Error('会话已过期')}const data=await response.json();if(!response.ok)throw Error(data.error||data.detail||'操作失败');return data}
async function refreshStatus(){statusData=await api('/api/cms/status');$('mode').textContent=statusData.mode==='production'?'生产模式 · 安装包':'开发模式 · 源码启动';$('experimental').disabled=statusData.mode==='production';$('publicEnabled').checked=statusData.publicEnabled;$('securityReminder').checked=statusData.securityReminder;$('notice').hidden=!statusData.securityReminder||!statusData.publicEnabled;$('notice').textContent='当前入口已连接公网。请妥善保管链接并使用独立长密码。'+(statusData.mode==='production'?'当前为安装包生产实例，配置会直接作用于生产服务。':'当前为源码开发实例，配置修改会作用于当前开发服务。');$('publicUrl').textContent=statusData.publicEnabled?(statusData.publicUrl||'正在建立公网连接…'):'公网连接已关闭'}
async function saveSecurity(){try{await api('/api/cms/security','PUT',{publicEnabled:$('publicEnabled').checked,securityReminder:$('securityReminder').checked});await refreshStatus();message('访问安全设置已保存')}catch(error){message(error.message,true);await refreshStatus()}}
function drawChannels(){$('channels').replaceChildren();for(const item of channels){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=item.hidden;input.addEventListener('change',async()=>{const old=item.hidden;item.hidden=input.checked;try{const data=await api('/api/cms/channels/visibility','PUT',{hidden:channels.filter(c=>c.hidden).map(c=>c.alias)});channels=data.platforms;drawChannels();message('平台渠道设置已保存')}catch(error){item.hidden=old;input.checked=old;message(error.message,true)}});label.append(input,document.createTextNode(item.name));$('channels').append(label)}}
$('publicEnabled').addEventListener('change',saveSecurity);$('securityReminder').addEventListener('change',saveSecurity);
$('headless').addEventListener('change',async()=>{try{await api('/api/cms/headless','PUT',{headless:$('headless').checked});message('无头设置已保存，下次启动浏览器生效')}catch(error){message(error.message,true)}});
$('loginMode').addEventListener('change',async()=>{try{await api('/api/cms/login-mode','PUT',{mode:$('loginMode').value});message('登录模式已保存，重启后端后生效')}catch(error){message(error.message,true)}});
$('logout').addEventListener('click',async()=>{await api('/auth/logout','POST',{});location.replace('/login')});
$('passwordForm').addEventListener('submit',async event=>{event.preventDefault();try{await api('/api/cms/password','PUT',{currentPassword:$('currentPassword').value,newPassword:$('newPassword').value});location.replace('/login')}catch(error){message(error.message,true)}});
(async()=>{try{await refreshStatus();const [mode,headless,platforms]=await Promise.all([api('/api/cms/login-mode'),api('/api/cms/headless'),api('/api/cms/channels')]);$('loginMode').value=mode.mode;$('headless').checked=headless.headless;channels=platforms.platforms||[];drawChannels()}catch(error){message(error.message,true)}})();setInterval(()=>refreshStatus().catch(()=>{}),15000);
</script></body></html>
