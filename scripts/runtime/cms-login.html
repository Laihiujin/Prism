<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism CMS · 登录</title>
<style nonce="__NONCE__">*{box-sizing:border-box}body{margin:0;background:#08090b;color:#eee;font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.panel{width:min(420px,92vw);padding:36px;border:1px solid #2b2b2b;border-radius:18px;background:#111216}h1{font-size:25px;margin:20px 0 10px}.muted{color:#a5a6ad;line-height:1.7}.badge{border:1px solid #2b2b2b;padding:5px 9px;border-radius:6px;font-size:12px}label{display:block;margin-top:28px}input,button{width:100%;padding:13px;margin-top:10px;border:1px solid #2b2b2b;border-radius:8px;font:inherit}input{background:#090a0c;color:#fff}button{background:#eee;color:#111;cursor:pointer;margin-top:18px}#error{color:#fca5a5;min-height:22px}small{display:block;margin-top:22px;color:#81838e;line-height:1.7}</style></head>
<body><main class="panel"><span class="badge">__MODE__</span><h1>Prism CMS</h1><p class="muted">受保护的后台管理入口。<br>输入访问密码后继续。</p><form id="login"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="128" autofocus><button id="submit">登录后台</button><p id="error" role="alert"></p></form><small>会话在两小时后过期。连续输错密码会暂时限制登录。</small></main>
<script nonce="__NONCE__">document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'登录失败');location.replace('/cms')}catch(error){document.getElementById('error').textContent=error.message}finally{button.disabled=false}})</script></body></html>
