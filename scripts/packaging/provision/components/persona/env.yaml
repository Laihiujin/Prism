# persona-studio 组件环境定义（示例）。
# 这是一个 micromamba environment.yml 的骨架：
#   - {{CHANNELS}} 会被 provision.py 替换成所选镜像的 conda 通道列表。
#   - 组件可以带自己的 python 版本 / 额外原生依赖（例如 torch、特定的 numpy 等）。
#   - pip 层用标准的 -r 相对/绝对路径。
#
# 用法:
#   python3 scripts/packaging/provision/provision.py --component persona --mirror tuna
name: prism-persona
channels:
{{CHANNELS}}
dependencies:
  - python=3.11
  - pip
  - pip:
      # 指到该组件自己的依赖清单（绝对路径），例如:
      #   - -r /abs/path/to/persona-studio/requirements.txt
      - pillow
