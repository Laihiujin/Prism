# persona-studio 组件环境（隔离，固定给 persona 用）。
# 组件本体（tools/persona-studio/engine）由 provision.py 用
#   pip install -e <engine>[api,launch,secure]
# 装入本环境并生成 bin/persona 入口——其依赖（fastapi/uvicorn/playwright/cryptography）
# 也一并装进来，只会落在本环境里，不污染共享 prismenv。
name: prism-persona
channels:
{{CHANNELS}}
dependencies:
  - python=3.11
  - pip
